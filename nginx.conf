server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Public and local DNS resolvers so nginx resolves dynamically without crashing on startup
    resolver 1.1.1.1 8.8.8.8 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        # Defaults to local docker compose "http://backend:8080" or can be set via BACKEND_URL env var
        set $upstream "${BACKEND_URL}";
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
