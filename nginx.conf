server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Public and local DNS resolvers so nginx resolves dynamically without crashing on startup
    resolver 1.1.1.1 8.8.8.8 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        # Defaults to local docker compose "http://backend:8080" or can be set via BACKEND_URL env var
        set $upstream "${BACKEND_URL}";
        proxy_pass $upstream;
        proxy_http_version 1.1;

        # SSL configuration for external HTTPS upstreams (like https://*.onrender.com)
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_name $proxy_host;

        # Forward host as $proxy_host so Cloudflare / Render router routes to the correct service
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeouts to allow sleeping Render free-tier containers to wake up
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
